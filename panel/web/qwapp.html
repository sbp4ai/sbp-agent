<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="color-scheme" content="light">
<title>SBP4AI</title>
<style>
  :root{
    --bg:#ffffff; --bg-soft:#f6f7f9; --bg-hover:#eef2f8; --bg-term:#0d1117; --fg-term:#c9d1d9;
    --bd:#e3e7ed; --tx:#1f2329; --tx-dim:#5b6168; --tx-mute:#9aa1ab;
    --accent:#2b6cf6; --live:#18a058; --idle:#c2c8d0; --warn:#e8a33d; --err:#d9483f;
    --r:8px; --r-sm:6px; --fs-xs:11px; --fs-sm:12px; --fs-md:13px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--tx); font:var(--fs-md)/1.5
    -apple-system,BlinkMacSystemFont,"SF Pro SC","PingFang SC","Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased; overflow:hidden;
  }
  button{font-family:inherit}

  /* ---------- header ---------- */
  .hd{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--bd);
    background:var(--bg-soft);flex:0 0 auto}
  .hd .dot{width:8px;height:8px;border-radius:50%;background:var(--err);flex:0 0 auto;transition:.3s}
  .hd .dot.ok{background:var(--live)}
  .hd h1{margin:0;font-size:15px;font-weight:700;letter-spacing:.04em}
  .hd .sub{color:var(--tx-mute);font-size:var(--fs-xs)}
  .hd .sp{flex:1}
  .iconbtn{border:1px solid var(--bd);background:var(--bg);color:var(--tx-dim);border-radius:var(--r-sm);
    width:26px;height:26px;display:grid;place-items:center;cursor:pointer;font-size:13px;line-height:1;padding:0}
  .iconbtn:hover{background:var(--bg-hover);color:var(--tx)}
  .iconbtn.spin{animation:s .9s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}

  /* ---------- summary ---------- */
  .sum{display:flex;gap:6px;padding:7px 12px;border-bottom:1px solid var(--bd);background:var(--bg);flex:0 0 auto}
  .chip{flex:1;text-align:center;background:var(--bg-soft);border:1px solid var(--bd);border-radius:var(--r-sm);padding:4px 3px}
  .chip b{display:block;font-size:14px;font-weight:600;line-height:1.2}
  .chip span{display:block;color:var(--tx-mute);font-size:var(--fs-xs);margin-top:1px}

  /* ---------- list ---------- */
  .list{flex:1 1 auto;overflow-y:auto;min-height:0;padding:6px}
  .grp{margin-bottom:2px}
  .grp-hd{display:flex;align-items:center;gap:6px;width:100%;text-align:left;border:0;background:transparent;
    color:var(--tx);font-size:var(--fs-sm);font-weight:600;padding:6px 8px;border-radius:var(--r-sm);cursor:pointer}
  .grp-hd:hover{background:var(--bg-hover)}
  .caret{color:var(--tx-mute);font-size:9px;width:9px;flex:0 0 auto;transition:transform .15s}
  .grp.open .caret{transform:rotate(90deg)}
  .grp-hd .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .st-dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto;background:var(--idle)}
  .st-dot.on{background:var(--live)}
  .cnt{color:var(--tx-mute);font-size:var(--fs-xs);font-weight:400}
  .items{display:flex;flex-direction:column;gap:2px;padding:2px 0 4px 14px}
  .item{display:flex;align-items:flex-start;gap:7px;padding:6px 8px;border-radius:var(--r-sm);
    cursor:pointer;border:1px solid transparent;min-width:0}
  .item:hover{background:var(--bg-hover)}
  .item.sel{background:#eaf1ff;border-color:#c7dbff}
  .item .bd{flex:1;min-width:0}
  .item .t{font-size:var(--fs-sm);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .item.sel .t{color:#17428f;font-weight:600}
  .item .st{color:var(--tx-dim);font-size:var(--fs-xs);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
  .item .mt{display:flex;gap:5px;align-items:center;margin-top:3px;color:var(--tx-mute);font-size:var(--fs-xs);flex-wrap:wrap}
  .tag{border:1px solid var(--bd);background:var(--bg-soft);color:var(--tx-dim);border-radius:4px;
    padding:0 4px;font-size:10px;line-height:15px;height:15px;white-space:nowrap}
  .tag.ag{border-color:#cfe0d6;background:#e9f5ee;color:#2b7a4b}
  .tag.ac{background:#eaf1ff;border-color:#c7dbff;color:#17428f}
  .empty{padding:22px 14px;text-align:center;color:var(--tx-mute);font-size:var(--fs-sm);line-height:1.8}

  /* ---------- detail ---------- */
  #detail{position:absolute;inset:42px 0 0 0;background:var(--bg);display:flex;flex-direction:column;
    transform:translateX(100%);transition:transform .22s ease;z-index:5}
  #detail.show{transform:translateX(0)}
  .d-hd{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--bd);flex:0 0 auto}
  .d-hd .bt{border:0;background:transparent;color:var(--tx-dim);font-size:18px;cursor:pointer;padding:0 4px;line-height:1}
  .d-title{flex:1;min-width:0}
  .d-title b{font-size:var(--fs-sm);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .d-title .st{font-size:var(--fs-xs);color:var(--tx-mute)}
  .d-body{flex:1 1 auto;overflow-y:auto;min-height:0;display:flex;flex-direction:column}
  .d-sec-h{font-size:var(--fs-xs);color:var(--tx-mute);padding:8px 12px 3px;font-weight:600;letter-spacing:.03em}
  .more{margin:6px 12px;padding:5px;border:1px solid var(--bd);background:var(--bg-soft);border-radius:var(--r-sm);
    color:var(--tx-dim);font-size:var(--fs-xs);cursor:pointer;text-align:center}
  .more:hover{background:var(--bg-hover)}

  /* history msgs */
  .msg{display:flex;gap:7px;padding:7px 12px;align-items:flex-start}
  .msg .av{flex:0 0 auto;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:700;color:#fff;margin-top:1px}
  .msg.user .av{background:#2b6cf6}
  .msg.agent .av{background:#18a058}
  .msg.wrap{flex-direction:column;align-items:stretch}
  .msg .bubble{max-width:100%;font-size:var(--fs-sm);white-space:pre-wrap;word-break:break-word}
  .msg.user .bubble{color:#14306b}
  .msg .meta{font-size:10px;color:var(--tx-mute);margin-top:2px}
  .msg .tools{font-size:10px;color:#7a5c00;background:#fdf6e3;border:1px solid #f0e1b0;border-radius:4px;padding:1px 5px;margin-top:3px;display:inline-block}

  /* terminal */
  .term{background:var(--bg-term);color:var(--fg-term);font:11px/1.45 "SF Mono",ui-monospace,Menlo,Consolas,monospace;
    padding:8px 10px;white-space:pre-wrap;word-break:break-word;overflow-x:hidden;
    border-top:1px solid var(--bd);max-height:38vh;overflow-y:auto}
  .term.collapsed{display:none}

  /* prompts */
  .prompts{padding:6px 10px;display:flex;flex-direction:column;gap:5px;border-top:1px solid var(--bd);background:var(--bg-soft)}
  .prompts[hidden]{display:none}
  .p-title{font-size:var(--fs-sm);font-weight:600}
  .p-desc{font-size:var(--fs-xs);color:var(--tx-dim);margin-top:1px}
  .p-opt{border:1px solid var(--bd);background:var(--bg);border-radius:var(--r-sm);padding:7px 9px;cursor:pointer;
    font-size:var(--fs-sm);display:flex;gap:7px;align-items:flex-start;text-align:left;width:100%}
  .p-opt:hover{background:var(--bg-hover)}
  .p-opt .ix{flex:0 0 auto;width:18px;height:18px;border-radius:4px;background:var(--accent);color:#fff;
    display:grid;place-items:center;font-size:11px;font-weight:700}
  .p-opt.risk-danger{border-color:#f3b6b1}.p-opt.risk-danger .ix{background:var(--err)}
  .p-opt.risk-warn{border-color:#f0d49a}.p-opt.risk-warn .ix{background:var(--warn)}
  .p-opt .lab{flex:1}
  .p-opt .desc{display:block;color:var(--tx-dim);font-size:var(--fs-xs);margin-top:1px}

  /* composer */
  .composer{flex:0 0 auto;display:flex;flex-direction:column;gap:6px;padding:7px 10px;border-top:1px solid var(--bd);background:var(--bg)}
  .keys{display:flex;gap:4px;flex-wrap:wrap}
  .key{border:1px solid var(--bd);background:var(--bg-soft);border-radius:4px;padding:2px 7px;font-size:var(--fs-xs);
    cursor:pointer;color:var(--tx-dim)}
  .key:hover{background:var(--bg-hover);color:var(--tx)}
  .crow{display:flex;gap:6px;align-items:flex-end}
  .input{flex:1;resize:none;border:1px solid var(--bd);border-radius:var(--r-sm);padding:6px 8px;font:inherit;font-size:var(--fs-sm);
    max-height:96px;outline:none}
  .input:focus{border-color:var(--accent)}
  .send{border:0;background:var(--accent);color:#fff;border-radius:var(--r-sm);padding:7px 14px;font-size:var(--fs-sm);
    cursor:pointer;font-weight:600}
  .send:disabled{opacity:.45;cursor:default}
  .hint{font-size:var(--fs-xs);color:var(--tx-mute)}

  .alert{margin:8px 12px;padding:7px 9px;border-radius:var(--r-sm);font-size:var(--fs-sm);
    border:1px solid #f3cfcb;background:#fdf1f0;color:#8b2b23}
  [hidden]{display:none !important}
</style>
</head>
<body>
<header class="hd">
  <span class="dot" id="dot" title="未连接"></span>
  <h1>SBP4AI</h1>
  <span class="sub">本地 agent 会话</span>
  <span class="sp"></span>
  <button class="iconbtn" id="btnRefresh" title="刷新">⟳</button>
  <button class="iconbtn" id="btnOpen" title="在完整面板打开">⧉</button>
</header>

<div class="sum" id="sum" hidden>
  <div class="chip"><b id="cSess">0</b><span>会话</span></div>
  <div class="chip"><b id="cLive">0</b><span>活跃</span></div>
  <div class="chip"><b id="cAgent">0</b><span>agent 类型</span></div>
</div>

<div class="list" id="list"><div class="empty">连接中…</div></div>

<div id="detail">
  <div class="d-hd">
    <button class="bt" id="btnBack" title="返回">‹</button>
    <div class="d-title"><b id="dTitle">—</b><span class="st" id="dState"></span></div>
    <span class="tag ag" id="dAgent" hidden></span>
  </div>
  <div class="d-body" id="dBody">
    <div class="d-sec-h" id="histH" hidden>对话历史（我 ⇄ 智能体）</div>
    <div class="more" id="histMore" hidden>加载更早的消息…</div>
    <div id="history"></div>
    <div class="d-sec-h" id="termH">实时屏幕</div>
    <pre class="term" id="term"></pre>
    <div class="prompts" id="prompts" hidden></div>
  </div>
  <div class="composer" id="composer" hidden>
    <div class="keys" id="keys"></div>
    <div class="crow">
      <textarea class="input" id="input" rows="1" placeholder="输入指令，Enter 发送 / Shift+Enter 换行"></textarea>
      <button class="send" id="send" disabled>发送</button>
    </div>
    <div class="hint" id="hint"></div>
  </div>
</div>

<script>
(function(){
  "use strict";
  var $ = function(id){ return document.getElementById(id); };
  var esc = function(s){ return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };

  // ---- 后端地址：?api= > window.SBP_CONFIG.api > 同源默认 ----
  function resolveApi(){
    try{
      var q = new URLSearchParams(location.search);
      var a = q.get('api');
      if(a) return a.replace(/\/+$/,'');
      if(window.SBP_CONFIG && window.SBP_CONFIG.api) return String(window.SBP_CONFIG.api).replace(/\/+$/,'');
    }catch(e){}
    return '';  // 同源
  }
  var API = resolveApi();
  function url(p){ return API ? (API + p) : p; }

  // ---- 状态 ----
  var indexEtag = null, stateEtag = {}, cur = null, pollTimer = null;
  var histHasMore = false, histBefore = null;

  function stripAnsi(s){ return (s||'').replace(/\x1b\[[0-9;?]*[a-zA-Z]|\x1b\][^\x07]*\x07|\x1b[()][A-Z0-9]|\r/g,''); }
  function ago(ts){
    if(!ts) return '';
    var d = (Date.now() - ts)/1000;
    if(d<60) return '刚刚';
    if(d<3600) return Math.floor(d/60)+' 分钟前';
    if(d<86400) return Math.floor(d/3600)+' 小时前';
    return Math.floor(d/86400)+' 天前';
  }

  // ---- 底层请求 ----
  function getJSON(path, etag, cb){
    var h = {};
    if(etag) h['If-None-Match'] = etag;
    fetch(url(path), {headers:h, cache:'no-store'}).then(function(r){
      var nEtag = r.headers.get('ETag');
      if(r.status === 304){ cb(null, null, etag); return; }
      if(!r.ok){ cb(new Error('HTTP '+r.status), null, etag); return; }
      r.json().then(function(d){ cb(null, d, nEtag); }).catch(function(e){ cb(e, null, etag); });
    }).catch(function(e){ cb(e, null, etag); });
  }

  function rpc(name, payload){
    return fetch(url('/api/rpc'), {
      method:'POST', cache:'no-store',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ frames:[{ type:'req', name:name, payload:payload||{} }] })
    }).then(function(r){ return r.json(); }).then(function(d){
      var frames = (d && d.frames) || [];
      return frames[0] || { ok:false };
    });
  }

  function setConn(ok){
    var dot = $('dot');
    dot.className = 'dot' + (ok ? ' ok' : '');
    dot.title = ok ? '已连接' : '未连接';
  }

  // ---- 索引（会话树）----
  function loadIndex(){
    getJSON('/api/index', indexEtag, function(err, data, etag){
      if(err){ setConn(false); return; }
      if(data === null) return;            // 304，没变
      indexEtag = etag;
      setConn(true);
      renderIndex(data);
    });
  }

  function renderIndex(data){
    var groups = data.groups || [];
    var sess=0, live=0, agents={};
    var html = '';
    groups.forEach(function(g){
      var items = g.items || [];
      sess += items.length;
      if(g.live) live++;
      var open = (cur && g.name === cur.group) || g.live;
      var rows = '';
      if(!items.length){
        rows = '<div class="item" style="cursor:default"><div class="bd"><div class="st">无可读会话</div></div></div>';
      }
      items.forEach(function(it){
        if(it.active) live++;
        if(it.agent) agents[it.agent] = 1;
        var sel = (cur && cur.sid === it.sid) ? ' sel' : '';
        var tags = '';
        if(it.agent_display || it.agent)
          tags += '<span class="tag ag">'+esc(it.agent_display||it.agent)+'</span>';
        if(it.active) tags += '<span class="tag ac">active</span>';
        var sub = it.subtitle || '';
        rows += '<div class="item'+sel+'" data-sid="'+esc(it.sid)+'" data-g="'+esc(g.name)+'" data-kind="'+esc(it.kind||'')+'" data-agent="'+esc(it.agent||'')+'">'
          + '<span class="st-dot'+(it.active?' on':'')+'"></span>'
          + '<div class="bd"><div class="t">'+esc(it.title||it.short||it.sid)+'</div>'
          + (sub?'<div class="st">'+esc(sub)+'</div>':'')
          + (tags?'<div class="mt">'+tags+'</div>':'') + '</div></div>';
      });
      html += '<div class="grp'+(open?' open':'')+'">'
        + '<button class="grp-hd"><span class="caret">▶</span>'
        + '<span class="st-dot'+(g.live?' on':'')+'"></span>'
        + '<span class="nm">'+esc(g.name)+'</span><span class="cnt">'+(items.length||'')+'</span></button>'
        + '<div class="items"'+(open?'':' hidden')+'>'+rows+'</div></div>';
    });
    if(!groups.length) html = '<div class="empty">没有检测到 tmux 会话。<br>先在终端跑一个 agent（claude / qwen / codex / aider …）</div>';
    $('list').innerHTML = html;
    $('sum').hidden = false;
    $('cSess').textContent = sess;
    $('cLive').textContent = live;
    $('cAgent').textContent = Object.keys(agents).length;
  }

  // ---- 打开会话 ----
  function openSession(el){
    var sid = el.getAttribute('data-sid');
    var kind = el.getAttribute('data-kind');
    var agent = el.getAttribute('data-agent');
    var group = el.getAttribute('data-g');
    cur = { sid:sid, kind:kind, agent:agent, group:group,
            title: el.querySelector('.t') ? el.querySelector('.t').textContent : sid };
    $('dTitle').textContent = cur.title;
    $('dAgent').textContent = agent;
    $('dAgent').hidden = !agent;
    $('composer').hidden = false;
    $('detail').classList.add('show');
    $('history').innerHTML = '';
    $('term').textContent = '读取中…';
    $('prompts').hidden = true;
    histHasMore = false; histBefore = null;
    updateComposer();

    if(kind && kind !== 'term'){           // claude 类：有结构化历史
      $('histH').hidden = false;
      $('histMore').hidden = true;
      loadHistory();
    } else {
      $('histH').hidden = true;
      $('histMore').hidden = true;
    }
    pollState(true);
    if(pollTimer) clearInterval(pollTimer);
    pollTimer = setInterval(function(){ pollState(false); }, 2500);
  }

  function closeDetail(){
    $('detail').classList.remove('show');
    cur = null;
    if(pollTimer){ clearInterval(pollTimer); pollTimer = null; }
  }

  // ---- 历史（claude 会话：我发的消息 + 智能体回复摘要）----
  function loadHistory(){
    if(!cur) return;
    var p = '/api/history?sid='+encodeURIComponent(cur.sid) + (histBefore ? '&before='+histBefore : '');
    getJSON(p, null, function(err, data){
      if(err){
        $('histH').hidden = true;
        $('history').innerHTML = '<div class="msg wrap"><div class="hint" style="padding:6px 12px">该会话无结构化历史（仅实时屏幕可用）</div></div>';
        return;
      }
      if(!data || !data.items){ return; }
      histHasMore = !!data.has_more;
      histBefore = data.next_before || null;
      var more = $('histMore');
      more.hidden = !histHasMore;
      var frag = document.createDocumentFragment();
      data.items.forEach(function(m){ frag.appendChild(renderMsg(m)); });
      $('history').insertBefore(frag, $('history').firstChild);  // 倒序：新→旧，插到顶部
      $('dBody').scrollTop = 0;
    });
  }

  function renderMsg(m){
    var role = m.role === 'user' ? 'user' : 'agent';
    var div = document.createElement('div');
    div.className = 'msg ' + (m.role==='user' ? 'user' : 'agent');
    var av = document.createElement('div'); av.className='av'; av.textContent = m.role==='user' ? '我' : 'A';
    var body = document.createElement('div'); body.style.flex='1'; body.style.minWidth='0';
    var b = document.createElement('div'); b.className='bubble'; b.textContent = m.text || '';
    body.appendChild(b);
    var meta = document.createElement('div'); meta.className='meta';
    meta.textContent = (m.model ? m.model+' · ' : '') + (m.ts ? m.ts.replace('T',' ').slice(0,19) : '');
    if(m.truncated) meta.textContent += ' · 已截断为摘要';
    body.appendChild(meta);
    if(m.tools && m.tools.length){
      var t = document.createElement('span'); t.className='tools';
      t.textContent = '⚙ ' + m.tools.join(', ');
      body.appendChild(t);
    }
    div.appendChild(av); div.appendChild(body);
    return div;
  }

  // ---- 实时屏幕 + 选项卡 ----
  function pollState(force){
    if(!cur) return;
    getJSON('/api/state?sid='+encodeURIComponent(cur.sid), stateEtag[cur.sid], function(err, data, etag){
      if(err){ return; }
      if(data === null) return;            // 304
      stateEtag[cur.sid] = etag;
      if(!data) return;
      $('dState').textContent = data.status || '';
      var lines = data.lines || [];
      var term = $('term');
      var atBottom = term.scrollTop + term.clientHeight >= term.scrollHeight - 24;
      term.textContent = stripAnsi(lines.join('\n'));
      if(atBottom) term.scrollTop = term.scrollHeight;
      renderPrompts(data.prompt);
    });
  }

  function renderPrompts(spec){
    var box = $('prompts');
    if(!spec || !spec.options || !spec.options.length){ box.hidden = true; box.innerHTML=''; return; }
    box.hidden = false;
    var h = '<div class="p-title">'+esc(spec.title||'请选择')+'</div>';
    if(spec.detail) h += '<div class="p-desc">'+esc(spec.detail)+'</div>';
    spec.options.forEach(function(o){
      var rc = o.risk === 'danger' ? 'risk-danger' : (o.risk === 'warn' ? 'risk-warn' : '');
      h += '<button class="p-opt '+rc+'" data-idx="'+esc(o.index)+'">'
        + '<span class="ix">'+esc(o.index)+'</span>'
        + '<span class="lab">'+esc(o.label)+(o.desc?('<span class="desc">'+esc(o.desc)+'</span>'):'')+'</span></button>';
    });
    box.innerHTML = h;
    Array.prototype.forEach.call(box.querySelectorAll('.p-opt'), function(btn){
      btn.onclick = function(){
        var choice = parseInt(btn.getAttribute('data-idx'),10);
        rpc('session.answer', { sid:cur.sid, pid:spec.pid, choice:choice }).then(function(){
          box.hidden = true; box.innerHTML='';
        });
      };
    });
  }

  // ---- 输入 ----
  function updateComposer(){
    var term = cur && (cur.kind === 'term' || !cur.kind);
    $('hint').textContent = term
      ? '直接把文本发进终端；出现选项时用上方卡片选择。'
      : '可发指令到终端；该会话的对话历史见上方。';
    // 快捷键
    var keys = ['ENTER','ESC','TAB','UP','DOWN','C-C'];
    var kh = '';
    keys.forEach(function(k){ kh += '<span class="key" data-k="'+k+'">'+k+'</span>'; });
    $('keys').innerHTML = kh;
    Array.prototype.forEach.call($('keys').querySelectorAll('.key'), function(k){
      k.onclick = function(){ rpc('session.input',{sid:cur.sid,kind:'key',key:k.getAttribute('data-k')}); };
    });
    $('send').disabled = false;
  }

  function sendText(){
    if(!cur) return;
    var ta = $('input');
    var text = ta.value;
    if(!text.trim()) return;
    rpc('session.input', { sid:cur.sid, kind:'text', text:text, submit:true }).then(function(){
      ta.value=''; ta.style.height='auto';
    });
  }

  // ---- 事件 ----
  $('list').addEventListener('click', function(e){
    var grp = e.target.closest('.grp-hd');
    if(grp){ var g = grp.parentElement; g.classList.toggle('open');
      var it = g.querySelector('.items'); if(it) it.hidden = !g.classList.contains('open'); return; }
    var item = e.target.closest('.item');
    if(item && item.getAttribute('data-sid')) openSession(item);
  });
  $('btnBack').onclick = closeDetail;
  $('btnRefresh').onclick = function(){ indexEtag=null; loadIndex(); if(cur) pollState(true); };
  $('histMore').onclick = loadHistory;
  $('btnOpen').onclick = function(){ window.open(url('/') , '_blank'); };
  $('send').onclick = sendText;
  $('input').addEventListener('input', function(){ this.style.height='auto'; this.style.height=Math.min(this.scrollHeight,96)+'px'; });
  $('input').addEventListener('keydown', function(e){
    if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); sendText(); }
  });

  // ---- 启动 ----
  loadIndex();
  setInterval(loadIndex, 6000);
  setConn(false);
})();
</script>
</body>
</html>
