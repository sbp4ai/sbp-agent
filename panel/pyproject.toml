[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tmux-ai-coder-panel"
version = "1.0.6"
description = "tmux + 多 CLI 会话本地面板（Claude Code / Qwen Code / Codex / Aider / OpenCode / Qoder / dsh 等），SBP4AI 统一适配器识别。左侧 tmux 会话树，右侧懒加载会话流 + 历史。"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "slamKun" }]
keywords = ["tmux", "claude-code", "codex", "aider", "opencode", "qwen-code", "qoder", "dsh", "agent", "panel", "sbp4ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Embedded Systems",
    "Topic :: Terminals",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-dotenv>=1.0",
]

[project.urls]
Homepage = "https://github.com/sbp4ai/sbp-agent"
Repository = "https://github.com/sbp4ai/sbp-agent"
Specification = "https://github.com/sbp4ai/sbp-spec"

[project.scripts]
tmux-panel = "tmux_panel.__main__:main"

[tool.setuptools]
packages = ["tmux_panel"]

[tool.setuptools.package-data]
tmux_panel = ["web/**/*", "web/*"]
